id: "zeeland_fox_22"
name: "Day Sail, August, Zeeland Fox 22"
description: "Packing list for a summer day sail in Zeeland on a Fox 22."
showers: 1
hideShowers: true
disableRoles: true

warnings:
  - id: "warn_fox_1"
    text: "No hard baggage: Fox 22 cabin space is extremely tiny. Bring a soft backpack only."
  - id: "warn_fox_2"
    text: "Stable footwear: Ensure you have stable shoes that hold your foot securely on the deck."

luggages:
  - id: "lug_3"
    name: "On me"
    icon: "on_person"
    color: "#B10DC9"
  - id: "lug_2"
    name: "Backpack"
    icon: "backpack"
    color: "#FF851B"

categories:
  - id: "on_water"
    title: "🌊 On the water"
    priority: "nice-to-have"
    items:
      - id: "water_swimwear"
        name: "Swimwear"
        description: "Wear it under your layers so you can jump in for a quick swim."
        defaultBag: "lug_3"
      - id: "water_bottoms"
        name: "Bottoms (shorts)"
        description: "Active, lightweight, quick-drying shorts for deck movement."
        defaultBag: "lug_2"
      - id: "water_tshirt"
        name: "Top (t-shirt)"
        description: "Standard active short-sleeve shirt."
        defaultBag: "lug_3"
      - id: "water_longshirt"
        name: "Top (long shirt)"
        description: "Keeps you shielded from UV rays and the strong cooling wind."
        defaultBag: "lug_3"
      - id: "water_jacket"
        name: "Windproof jacket"
        description: "Essential for staying warm against deck wind and light salt spray."
        defaultBag: "lug_2"
      - id: "water_footwear"
        name: "Sneakers or secure sandals"
        description: "Stable footwear holding your foot securely on deck."
        defaultBag: "lug_3"
      - id: "water_sunscreen"
        name: "Sunscreen"
        description: "Water reflections amplify UV exposure. Keep yourself protected."
        defaultBag: "lug_2"
      - id: "water_sunglasses"
        name: "Sunglasses with strap"
        description: " Bright deck glare. Ensure they have a strap so they don't slide into the lake!"
        defaultBag: "lug_3"
      - id: "water_cap"
        name: "Hat or cap"
        description: "Keep the sun out of your eyes and protect your head."
        defaultBag: "lug_3"
      - id: "water_lunch"
        name: "Lunch"
        description: "To enjoy during the mid-day anchor break."
        defaultBag: "lug_2"
      - id: "water_snacks"
        name: "Snacks"
        description: "Quick energy bites for sailing intervals."
        defaultBag: "lug_2"
      - id: "water_bottle"
        name: "Water bottle"
        description: "Hydration is key. Keep enough fresh water handy."
        defaultBag: "lug_2"
      - id: "water_phone"
        name: "Waterproof phone case or phone tether"
        description: "Phones love to sleep in the water! Secure it safely."
        defaultBag: "lug_3"
      - id: "water_towel"
        name: "Towel"
        description: "Compact travel towel to dry off after swimming."
        defaultBag: "lug_2"
      - id: "water_gloves"
        name: "Sailing gloves"
        description: "Prevents rope burn on active sheets and lines."
        defaultBag: "lug_2"
      - id: "water_power"
        name: "Power bank"
        description: "Keeps your phone charged for navigation and photos."
        defaultBag: "lug_2"
      - id: "water_rope"
        name: "Short practice rope"
        description: "To practice knots and sailing exercises on the way."
        defaultBag: "lug_2"

  - id: "afterwards"
    title: "👕 Afterwards"
    priority: "nice-to-have"
    items:
      - id: "after_sweater"
        name: "Sweater"
        description: "A warm sweater or hoodie to cozy up in after the cruise."
        defaultBag: "lug_2"
      - id: "after_sweatpants"
        name: "Sweatpants"
        description: "Comfy pants to change into for the trip home."
        defaultBag: "lug_2"
      - id: "after_underwear"
        name: "Fresh change of underwear"
        description: "In case you get wet during active deck maneuvers."
        defaultBag: "lug_2"
      - id: "after_socks"
        name: "Spare dry socks"
        description: "Cold feet ruin the afternoon. Keep a spare dry pair in your bag."
        defaultBag: "lug_2"

  - id: "do_not_bring"
    title: "🚫 Do not bring"
    priority: "nice-to-have"
    items:
      - id: "not_hard_bag"
        name: "Large hard suitcase"
        description: "Fox 22 cabin is tiny. Completely impossible to store. Soft bags only!"
        defaultBag: "lug_2"
      - id: "not_alcohol"
        name: "Alcohol on water"
        description: "Safety first. Save drinks for the dock afterwards."
        defaultBag: "lug_2"
      - id: "not_valuables"
        name: "Unnecessary valuables"
        description: "Leave behind anything you are afraid of losing."
        defaultBag: "lug_2"
      - id: "not_loose_glass"
        name: "Loose glass bottles"
        description: "Glass shards on active decks are a major hazard. Choose cans or flasks."
        defaultBag: "lug_2"
