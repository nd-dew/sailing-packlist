schema: 1
name: Mallorca Bachata Birthday Sail 2027
description: "13–20 February 2027: a week around Mallorca on two boats, combining winter sailing, exploring, bachata socials and a birthday celebration. Captain of Alissa. Route and nights ashore depend on weather, suitable ports and dance schedules."
showers: 7
warnings:
  - id: warn_1
    text: "No Hard Suitcases: Soft bags only! Rigid luggage is impossible to store on a boat. Bring a soft duffel."
  - id: warn_2
    text: "Winter sailing: bring warm layers and waterproof jacket and trousers. Keep a complete dry change for sleeping."
  - id: warn_bedding
    text: Bedding is expected to be provided; bring a sleeping bag for extra warmth and confirm cabin heating with the charter base.
  - id: warn_dance
    text: Pack separate clean dance shoes and fresh tops for bachata socials.
  - id: warn_safety
    text: Before departure, confirm that Alissa has properly fitted lifejackets for everyone and suitable harnesses/tethers and other safety equipment. Bring personal gear if the charter does not supply what you need.
  - id: warn_skippers
    text: Confirm the charter base accepts your skipper and radio documents. Agree weather decisions, daily rendezvous, communications and fallback ports with the other skipper.
luggages:
  - id: lug_3
    name: On me
    icon: on_person
    color: "#B10DC9"
  - id: lug_2
    name: Backpack
    icon: backpack
    color: "#FF851B"
  - id: lug_1
    name: Duffel
    icon: duffel
    color: "#0074D9"
