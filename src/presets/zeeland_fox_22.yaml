id: "zeeland_fox_22"
name: "Day Sail, August, Zeeland Fox 22"
description: "Packing list for a summer day sail in Zeeland on a Fox 22."
showers: 1
hideShowers: true
disableRoles: true

warnings:
  - id: "warn_fox_1"
    text: "No hard baggage: Fox 22 cabin space is extremely tiny. Bring a soft backpack only."
  - id: "warn_fox_2"
    text: "Stable footwear: Ensure you have stable shoes that hold your foot securely on the deck."

luggages:
  - id: "lug_3"
    name: "On me"
    icon: "on_person"
    color: "#B10DC9"
  - id: "lug_2"
    name: "Backpack"
    icon: "backpack"
    color: "#FF851B"

categories:
  - id: "on_water"
    title: "🌊 On the water"
    priority: "must-have"
    items:
      - id: "water_swimwear"
        name: "Swimwear (Bikini / Swim shorts)"
        description: "It's sunny and August! Wear it under your layers so you can jump in for a quick swim."
        defaultBag: "lug_3"
      - id: "water_pants"
        name: "Sweatpants or windy-deck shorts"
        description: "Normally sunny but windy on the water. Sweatpants are perfect for a active windy deck."
        defaultBag: "lug_2"
      - id: "water_sleeve"
        name: "Sun-protection long shirt or UV long sleeve"
        description: "Keeps you shielded from UV rays and the strong cooling wind."
        defaultBag: "lug_3"
      - id: "water_jacket"
        name: "Windproof or waterproof jacket"
        description: "Essential for staying warm against gusts of wind and salt spray."
        defaultBag: "lug_2"
      - id: "water_sunscreen"
        name: "Sunscreen (wind & sun protection)"
        description: "High SPF is crucial; water reflections amplify the UV exposure."
        defaultBag: "lug_2"
      - id: "water_sunglasses"
        name: "Sunglasses with strap"
        description: "Water reflections are bright. Ensure they have a strap so they don't slide into the lake!"
        defaultBag: "lug_3"
      - id: "water_cap"
        name: "Hat or cap"
        description: "Keep the sun out of your eyes and protect your head from UV rays."
        defaultBag: "lug_3"

  - id: "afterwards"
    title: "👕 Afterwards"
    priority: "should-have"
    items:
      - id: "after_warm_layer"
        name: "Warmer sleeve (hoodie / sweater for post-sail)"
        description: "Perfect to warm yourself up after the cruise."
        defaultBag: "lug_2"
      - id: "after_underwear"
        name: "Fresh change of underwear (if you get wet)"
        description: "Highly recommended in case you get wet during the sail."
        defaultBag: "lug_2"
      - id: "after_socks"
        name: "Spare dry socks"
        description: "Cold feet ruin the day. Always keep a dry pair."
        defaultBag: "lug_2"
      - id: "after_change"
        name: "Dry change of clothes"
        description: "To change into after the sail."
        defaultBag: "lug_2"

  - id: "footwear"
    title: "👟 Footwear"
    priority: "must-have"
    items:
      - id: "foot_sneakers"
        name: "Stable sneakers or secure-fitting sandals"
        description: "Stable shoes that hold your foot securely on deck. No need for marking-shoe anxiety."
        defaultBag: "lug_3"

  - id: "food_drinks"
    title: "🍏 Food and drinks"
    priority: "should-have"
    items:
      - id: "food_water"
        name: "Water bottle"
        description: "Hydration is key, doesn't need to be fancy or reusable, just bring enough water."
        defaultBag: "lug_2"
      - id: "food_lunch"
        name: "Lunch for mid-day anchor break"
        description: "Day sailing breaks are best enjoyed at anchor with a hearty meal."
        defaultBag: "lug_2"
      - id: "food_snacks"
        name: "Snacks for sailing intervals"
        description: "Quick energy bites for active sailing breaks."
        defaultBag: "lug_2"

  - id: "water_protection"
    title: "📱 Water protection"
    priority: "should-have"
    items:
      - id: "prot_phone_case"
        name: "Waterproof phone case or phone tether/rope"
        description: "Essential because phones love to sleep in the water! Secure it with a little rope or tether."
        defaultBag: "lug_3"
      - id: "prot_towel"
        name: "Towel"
        description: "Compact travel towel to dry off after swimming."
        defaultBag: "lug_2"

  - id: "optional_gear"
    title: "🧤 Sailing gear"
    priority: "nice-to-have"
    items:
      - id: "gear_gloves"
        name: "Sailing gloves"
        description: "Highly recommended to prevent rope burn on active lines."
        defaultBag: "lug_2"
      - id: "gear_power_bank"
        name: "Power bank"
        description: "Keeps your phone charged for navigation and photos."
        defaultBag: "lug_2"
      - id: "gear_rope"
        name: "Short practice rope (to practice knots on the way!)"
        description: "Optionally nice to have to practice knots and sailing exercises on the way."
        defaultBag: "lug_2"

  - id: "do_not_bring"
    title: "🚫 Do not bring"
    priority: "nice-to-have"
    items:
      - id: "not_hard_bag"
        name: "Large hard suitcase"
        description: "Fox 22 cabin is tiny. Completely impossible to store. Soft bags only!"
        defaultBag: "lug_2"
      - id: "not_alcohol"
        name: "Alcohol on water"
        description: "Safety first. Keep alcohol for afterwards on the dock."
        defaultBag: "lug_2"
      - id: "not_valuables"
        name: "Unnecessary valuables (or anything you are afraid of losing)"
        description: "Leave behind anything you are afraid of losing."
        defaultBag: "lug_2"
      - id: "not_loose_glass"
        name: "Loose glass bottles"
        description: "Broken glass on a small deck is a hazard. Stick to cans or flasks."
        defaultBag: "lug_2"
