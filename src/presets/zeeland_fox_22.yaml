id: "zeeland_fox_22"
name: "Day Sail, August, Zeeland Fox 22"
description: "Packing list for a summer day sail in Zeeland on a Fox 22."
showers: 1

warnings:
  - id: "warn_fox_1"
    text: "No hard baggage: Fox 22 cabin space is extremely tiny. Bring a soft backpack only."
  - id: "warn_fox_2"
    text: "Stable footwear: Ensure you have stable shoes that hold your foot securely on the deck."

luggages:
  - id: "lug_3"
    name: "On me"
    icon: "on_person"
    color: "#B10DC9"
  - id: "lug_2"
    name: "Backpack"
    icon: "backpack"
    color: "#FF851B"
  - id: "lug_1"
    name: "Duffel"
    icon: "duffel"
    color: "#0074D9"

categories:
  - id: "on_water"
    title: "🌊 On the water"
    priority: "must-have"
    items:
      - id: "water_swimwear"
        name: "Swimwear (Bikini / Swim shorts)"
        defaultBag: "lug_3"
      - id: "water_pants"
        name: "Sweatpants or windy-deck shorts"
        defaultBag: "lug_2"
      - id: "water_sleeve"
        name: "Sun-protection long shirt or UV long sleeve"
        defaultBag: "lug_3"
      - id: "water_jacket"
        name: "Windproof or waterproof jacket"
        defaultBag: "lug_2"
      - id: "water_sunscreen"
        name: "Sunscreen (wind & sun protection)"
        defaultBag: "lug_2"
      - id: "water_sunglasses"
        name: "Sunglasses with strap"
        defaultBag: "lug_3"
      - id: "water_cap"
        name: "Hat or cap"
        defaultBag: "lug_3"

  - id: "afterwards"
    title: "👕 Afterwards"
    priority: "should-have"
    items:
      - id: "after_warm_layer"
        name: "Warmer sleeve (hoodie / sweater for post-sail)"
        defaultBag: "lug_2"
      - id: "after_underwear"
        name: "Fresh change of underwear (if you get wet)"
        defaultBag: "lug_2"
      - id: "after_socks"
        name: "Spare dry socks"
        defaultBag: "lug_2"
      - id: "after_change"
        name: "Dry change of clothes"
        defaultBag: "lug_2"

  - id: "footwear"
    title: "👟 Footwear"
    priority: "must-have"
    items:
      - id: "foot_sneakers"
        name: "Stable sneakers or secure-fitting sandals"
        defaultBag: "lug_3"

  - id: "food_drinks"
    title: "🍏 Food and drinks"
    priority: "should-have"
    items:
      - id: "food_water"
        name: "Water bottle"
        defaultBag: "lug_2"
      - id: "food_lunch"
        name: "Lunch for mid-day anchor break"
        defaultBag: "lug_2"
      - id: "food_snacks"
        name: "Snacks for sailing intervals"
        defaultBag: "lug_2"

  - id: "water_protection"
    title: "📱 Water protection"
    priority: "should-have"
    items:
      - id: "prot_phone_case"
        name: "Waterproof phone case or phone tether/rope"
        defaultBag: "lug_3"
      - id: "prot_towel"
        name: "Towel"
        defaultBag: "lug_2"

  - id: "optional_gear"
    title: "🧤 Sailing gear"
    priority: "nice-to-have"
    items:
      - id: "gear_gloves"
        name: "Sailing gloves"
        defaultBag: "lug_2"
      - id: "gear_power_bank"
        name: "Power bank"
        defaultBag: "lug_2"
      - id: "gear_rope"
        name: "Short practice rope (to practice knots on the way!)"
        defaultBag: "lug_2"

  - id: "do_not_bring"
    title: "🚫 Do not bring"
    priority: "nice-to-have"
    items:
      - id: "not_hard_bag"
        name: "Large hard suitcase"
        defaultBag: "lug_1"
      - id: "not_alcohol"
        name: "Alcohol on water"
        defaultBag: "lug_1"
      - id: "not_valuables"
        name: "Unnecessary valuables (or anything you are afraid of losing)"
        defaultBag: "lug_1"
      - id: "not_loose_glass"
        name: "Loose glass bottles"
        defaultBag: "lug_1"
