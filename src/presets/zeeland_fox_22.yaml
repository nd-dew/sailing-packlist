id: "zeeland_fox_22"
name: "Day Sail, August, Zeeland Fox 22"
description: "Packing list for a summer day sail in Zeeland on a Fox 22."
showers: 1

warnings:
  - id: "warn_fox_1"
    text: "Non-slip shoes: Absolutely crucial for small open sailboats like Fox 22 to prevent slipping."
  - id: "warn_fox_2"
    text: "Minimal baggage: The Fox 22 has very limited cabin space. Bring a small backpack/dry bag only."

luggages:
  - id: "lug_3"
    name: "On me"
    icon: "on_person"
    color: "#B10DC9"
  - id: "lug_2"
    name: "Backpack"
    icon: "backpack"
    color: "#FF851B"
  - id: "lug_1"
    name: "Duffel"
    icon: "duffel"
    color: "#0074D9"

categories:
  - id: "clothing"
    title: "👕 Clothing"
    priority: "must-have"
    items:
      - id: "clothing_jacket"
        name: "Windproof or waterproof jacket"
        defaultBag: "lug_2"
      - id: "clothing_mid_layer"
        name: "Warm mid-layer"
        defaultBag: "lug_2"
      - id: "clothing_shirt"
        name: "Quick-drying shirt"
        defaultBag: "lug_2"
      - id: "clothing_shorts"
        name: "Quick-drying shorts or trousers"
        defaultBag: "lug_2"
      - id: "clothing_swimwear"
        name: "Swimwear"
        defaultBag: "lug_2"
      - id: "clothing_socks"
        name: "Spare socks"
        defaultBag: "lug_2"
      - id: "clothing_change"
        name: "Change of clothes"
        defaultBag: "lug_2"

  - id: "footwear"
    title: "👟 Footwear"
    priority: "must-have"
    items:
      - id: "footwear_non_slip"
        name: "Non-slip, non-marking shoes"
        defaultBag: "lug_3"

  - id: "sun_protection"
    title: "☀️ Sun protection"
    priority: "should-have"
    items:
      - id: "sun_screen"
        name: "Sunscreen"
        defaultBag: "lug_2"
      - id: "sun_glasses"
        name: "Sunglasses"
        defaultBag: "lug_3"
      - id: "sun_glasses_strap"
        name: "Sunglasses strap"
        defaultBag: "lug_3"
      - id: "sun_hat"
        name: "Hat or cap"
        defaultBag: "lug_3"

  - id: "food_drink"
    title: "🍏 Food and drink"
    priority: "should-have"
    items:
      - id: "food_bottle"
        name: "Reusable water bottle"
        defaultBag: "lug_2"
      - id: "food_lunch"
        name: "Lunch"
        defaultBag: "lug_2"
      - id: "food_snacks"
        name: "Snacks"
        defaultBag: "lug_2"

  - id: "personal_essentials"
    title: "🔑 Personal essentials"
    priority: "must-have"
    items:
      - id: "personal_id"
        name: "ID"
        defaultBag: "lug_3"
      - id: "personal_phone"
        name: "Phone"
        defaultBag: "lug_3"
      - id: "personal_medication"
        name: "Personal medication"
        defaultBag: "lug_3"
      - id: "personal_motion_sickness"
        name: "Motion-sickness medication if needed"
        defaultBag: "lug_2"

  - id: "water_protection"
    title: "🌊 Water protection"
    priority: "should-have"
    items:
      - id: "water_dry_bag"
        name: "Small dry bag"
        defaultBag: "lug_2"
      - id: "water_phone_case"
        name: "Waterproof phone case"
        defaultBag: "lug_3"
      - id: "water_towel"
        name: "Towel"
        defaultBag: "lug_2"

  - id: "optional_gear"
    title: "🧤 Optional sailing gear"
    priority: "nice-to-have"
    items:
      - id: "optional_gloves"
        name: "Sailing gloves"
        defaultBag: "lug_2"
      - id: "optional_power_bank"
        name: "Power bank"
        defaultBag: "lug_2"
      - id: "optional_binoculars"
        name: "Binoculars"
        defaultBag: "lug_2"

  - id: "do_not_bring"
    title: "🚫 Do not bring"
    priority: "nice-to-have"
    items:
      - id: "not_suitcase"
        name: "Large hard suitcase"
        defaultBag: "lug_1"
      - id: "not_marking_shoes"
        name: "Shoes that leave marks"
        defaultBag: "lug_1"
      - id: "not_glass_bottles"
        name: "Loose glass bottles"
        defaultBag: "lug_1"
      - id: "not_valuables"
        name: "Unnecessary valuables"
        defaultBag: "lug_1"
