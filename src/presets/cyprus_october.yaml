schema: 1
name: "Cyprus, October, 5 Nights"
description: "5-night sailing cruise in Cyprus (October). Warm Mediterranean sea (~24°C), mild autumn sun, and light evening breezes."
showers: 5
disableRoles: true

warnings:
  - id: "warn_cyprus_1"
    text: "Soft Duffel Only: Rigid suitcases cannot be stowed on charter boats. Bring a collapsible duffel bag."

luggages:
  - id: "lug_3"
    name: "On me"
    icon: "on_person"
    color: "#B10DC9"
  - id: "lug_1"
    name: "Duffel"
    icon: "duffel"
    color: "#0074D9"

categories:
  - id: "technical"
    title: "⚡ Technical stuff"
    priority: "should-have"
    items:
      - id: "cyp_headlamp"
        name: "Headlamp"
        description: "Hands-free light for night anchor watch and dim cabins."
        bag: "lug_1"
      - id: "cyp_phone_case"
        name: "Waterproof phone case"
        description: "Protection against water splashes and slips overboard."
        bag: "lug_1"
      - id: "cyp_rope"
        name: "Rope (10 meters)"
        description: "10m line to practice knots, lash gear, or general boat use."
        bag: "lug_1"
      - id: "cyp_phone_charger"
        name: "Charger"
        description: "Keep charged for navigation, photos, and safety."
        bag: "lug_3"
      - id: "cyp_thermos"
        name: "Thermos"
        bag: "lug_3"
      - id: "cyp_camera"
        name: "Camera"
        description: "Camera and charger/accessories for coastal and sailing shots."
        bag: "lug_3"
      - id: "cyp_type_g_adapter"
        name: "Type G plug converter"
        description: "Cyprus uses British 3-pin Type G outlets in marinas and ashore."
        bag: "lug_1"
      - id: "cyp_ebook"
        name: "E-book reader"
        description: "For relaxing and reading while at anchor or off watch."
        bag: "lug_3"
      - id: "cyp_camera_accessories_long_stick_mounts"
        name: "Camera accessories (long stick, mounts)"
        bag: "lug_1"
      - id: "cyp_laptop"
        name: "Laptop"
        bag: "lug_3"
      - id: "cyp_headphones"
        name: "Headphones"
        bag: "lug_3"
      - id: "cyp_power_bank"
        name: "Power bank"
        bag: "lug_3"

  - id: "formalities"
    title: "📄 Formalities"
    priority: "must-have"
    items:
      - id: "cyp_passport"
        name: "Passport"
        description: "Valid passport for international travel and port clearance."
        bag: "lug_3"
      - id: "cyp_sailing_cert"
        name: "Sailing certificate"
        description: "Skipper or crew sailing qualification certificate."
        bag: "lug_3"
      - id: "cyp_insurance"
        name: "Insurance"
        description: "Travel & sailing/diving health insurance policy document."
        bag: "lug_3"

  - id: "clothes"
    title: "👕 Clothes"
    priority: "must-have"
    items:
      - id: "cyp_underwear"
        name: "Underwear"
        qty: 5
        description: "5 pairs of fresh underwear for 5 nights."
        bag: "lug_1"
      - id: "cyp_socks"
        name: "Socks"
        qty: 6
        description: "6 pairs of comfortable socks."
        bag: "lug_1"
      - id: "cyp_long_tops"
        name: "Long sleeve top"
        qty: 2
        description: "2 breathable long-sleeved tops for sun and deck breeze protection."
        bag: "lug_1"
      - id: "cyp_rain_jacket"
        name: "Waterproof TOP"
        qty: 1
        description: "Lightweight, highly compressible waterproof jacket."
        bag: "lug_1"
      - id: "cyp_rain_pants"
        name: "Waterproof Bottom (bicycle over pants)"
        qty: 1
        description: "Compressible rain pants just in case of spray or light rain."
        bag: "lug_1"
      - id: "cyp_sneakers"
        name: "Sneakers"
        qty: 1
        description: "Comfortable non-slip sneakers for travel and safe footing on deck."
        bag: "lug_3"
      - id: "cyp_tops"
        name: "Tops (t-shirts)"
        qty: 6
        description: "6 daytime t-shirts."
        bag: "lug_1"
      - id: "cyp_sandals"
        name: "Sandals"
        qty: 1
        description: "For walking ashore, marina showers, and relaxing off-deck."
        bag: "lug_1"
      - id: "cyp_swimming_trunks"
        name: "Swimming trunks"
        bag: "lug_1"
      - id: "cyp_round_hat"
        name: "round Hat"
        bag: "lug_1"
      - id: "cyp_swimming_glasses"
        name: "Swimming glasses"
        bag: "lug_1"
      - id: "cyp_sailing_gloves"
        name: "Sailing Gloves"
        bag: "lug_1"
      - id: "cyp_short_pants"
        name: "Short Pants"
      - id: "cyp_long_sweatpants"
        name: "Long Sweatpants"
        bag: "lug_3"

  - id: "do_not_bring"
    title: "🚫 Do not bring"
    priority: "nice-to-have"
    items:
      - id: "not_hard_suitcase"
        name: "Large hard suitcase"
        description: "Impossible to store inside sailboat lockers. Duffel only."
        bag: "lug_1"
      - id: "not_foulies"
        name: "Heavy foul weather gear / rain boots"
        description: "It's 24°C with light wind—heavy ocean gear is unnecessary bulk."
        bag: "lug_1"

  - id: "cosmetics"
    title: "🧴 Cosmetics"
    priority: "should-have"
    items:
      - id: "cyp_towel"
        name: "Quickly drying towel"
        qty: 1
        description: "Compact microfiber towel that dries rapidly in the sea breeze."
        bag: "lug_1"
      - id: "cyp_sunscreen"
        name: "SPF Sunscreen"
        description: "Sunscreen for strong Mediterranean sun reflection on the water."
        bag: "lug_1"
      - id: "cyp_lip_balm"
        name: "Lip balm"
        description: "Lip balm with SPF to prevent chapped lips from salt and sun."
        bag: "lug_1"
      - id: "cyp_toothbrush_toothpaste"
        name: "Toothbrush + toothpaste"
        bag: "lug_1"
      - id: "cyp_flossing_stuff"
        name: "Flossing stuff"
      - id: "cyp_universal_gel"
        name: "Universal Gel"
      - id: "cyp_nail_clipers"
        name: "nail clipers"
      - id: "cyp_deodorant"
        name: "deodorant"

  - id: "med_kit"
    title: "Med kit"
    priority: "should-have"
    items:
      - id: "cyp_stomach_meds"
        name: "Activated Charcoal / Stomach Meds"
        description: "For indigestion, food poisoning, or upset stomach."
        bag: "lug_1"
      - id: "cyp_painkillers"
        name: "Painkillers (Ibuprofen / Paracetamol)"
        description: "For headaches, muscle soreness, or mild injuries."
        bag: "lug_1"

  - id: "cat_other"
    title: "📦 Other"
    items:
      - id: "cyp_eye_mask"
        name: "Eye mask"
        description: "Blocks bright early morning sunlight coming through cabin hatches."
        bag: "lug_1"
      - id: "cyp_earplugs"
        name: "Earplugs"
        description: "Blocks halyard slapping, anchor windlass, and cabin noise."
        bag: "lug_1"
      - id: "cyp_sunglasses"
        name: "Sunglasses"
