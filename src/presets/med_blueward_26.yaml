id: "med_blueward_26"
name: "Mediterranean - BlueWard 26"
showers: 7

warnings:
  - id: "warn_1"
    text: "No Hard Suitcases: Soft bags only! Rigid luggage is impossible to store on a boat. Bring a soft duffel."
  - id: "warn_2"
    text: "Water Shoes / Flip-flops: Essential for public showers and protecting your feet from sea urchins when swimming near rocky shores."

luggages:
  - id: "lug_1"
    name: "Main Duffel Bag"
  - id: "lug_2"
    name: "Day Backpack"

categories:
  - id: "docs"
    title: "📄 Get Formal"
    priority: "must-have"
    items:
      - id: "docs_passport"
        name: "ID Card / Passport"
        defaultBag: "lug_2"
      - id: "docs_health_insurance"
        name: "Health Insurance Card (EHIC)"
        description: "European Health Insurance Card or personal travel/medical insurance details."
        defaultBag: "lug_2"
      - id: "docs_printed"
        name: "Printed Documents"
        description: "Boarding pass (from charter), logbook, singing book, and any other materials you want physically printed."
        captainOnly: true
        defaultBag: "lug_2"
      - id: "docs_license"
        name: "Sailing License"
        description: "Required for the Skipper. Not needed for crew."
        captainOnly: true
        defaultBag: "lug_2"
      - id: "docs_vhf"
        name: "VHF License"
        description: "Official radio operator certificate."
        captainOnly: true
        defaultBag: "lug_2"
      - id: "docs_maps"
        name: "Nautical Maps & Instruments"
        description: "Essential navigation charts for the area."
        captainOnly: true
        defaultBag: "lug_2"
      - id: "docs_insurance"
        name: "Boat Insurance / Documents"
        description: "Charter documents and insurance papers."
        captainOnly: true
        defaultBag: "lug_2"
      - id: "docs_cash"
        name: "Cash (Local Currency)"
        description: "Many smaller island restaurants and local ports only accept cash."
        defaultBag: "lug_2"

  - id: "tough"
    title: "👕 Get Warm"
    priority: "must-have"
    items:
      - id: "base_thermal_top"
        name: "Thermal Base Layer (Top)"
        description: "Highly recommended for night watches."
      - id: "base_thermal_bot"
        name: "Thermal Base Layer (Bottom)"
        description: "Highly recommended for cold night watches."
      - id: "out_shoes_tough"
        name: "Tough Weather / Rain Boots"
        description: "For standing in the rain during a night watch. Keep your feet dry to stay warm!"
      - id: "out_mid_fleece"
        name: "Warm Mid-layer: Fleece / Puffer"
        description: "The layer that traps heat. Essential when the sun goes down. A light puffer is great for extra warmth without the bulk."
      - id: "out_mid_pants"
        name: "Warm Mid-layer: Sweatpants"
        description: "Comfy, warm pants for lounging or under waterproofs."
      - id: "out_wind_jacket"
        name: "Windproof / Waterproof Top"
        description: "Your outer shield against rain and salt spray."
      - id: "out_wind_pants"
        name: "Windproof / Waterproof Bottoms"
        description: "Keeps your legs dry when sitting on wet decks."

  - id: "base"
    title: "👕 Get Dressed"
    priority: "must-have"
    items:
      - id: "base_underwear"
        name: "Underwear"
        qty: 0
      - id: "base_socks"
        name: "Socks"
        qty: 0
      - id: "base_tshirt"
        name: "T-Shirts / Tops"
        qty: 0
      - id: "out_shoes_deck"
        name: "Sneakers"
        description: "One pair of sneakers for everything: exploring on land and moving on the boat. Ensure soles are non-marking."
      - id: "out_shorts"
        name: "Shorts"
      - id: "out_swim"
        name: "Swimwear"
        description: "Check the water temperature here: https://www.seatemperature.org/ to see if you need a shorty or just standard trunks."
      - id: "out_hat_warm"
        name: "Warm Beanie Hat"
        description: "Crucial for keeping body heat in during night watches."
      - id: "out_buff"
        name: "Buff / Neck Gaiter"
        description: "Round piece of material that can be made into a scarf or cap to warm yourself."
      - id: "out_hat_sun"
        name: "Sun Hat (Baseball Cap)"
      - id: "out_gloves"
        name: "Gloves"
        description: "Protects your hands from line burns when handling ropes."
      - id: "out_nice_clothes"
        name: "One \"Nice\" / Party Outfit"
        description: "Check with the captain! Are we dining at fancy marinas or fighting storms? Bring something unwrinkled or themed if planned."
      - id: "out_sunglasses"
        name: "Sunglasses"
        description: "Essential. Reflection from the water doubles the sun exposure to your eyes."

  - id: "toiletries"
    title: "🧴 Get Romantic"
    priority: "should-have"
    items:
      - id: "out_sleeping_bag"
        name: "Sleeping Bag"
        description: "Check with the captain! Most charters provide linens, but a sleeping bag is good for colder nights."
      - id: "toi_brush"
        name: "Toothbrush & Paste"
      - id: "toi_towel"
        name: "Quick-dry Sports Towel"
        description: "Saves space and dries much faster in the yacht cabin."
      - id: "toi_gel"
        name: "Universal Shower Gel / Shampoo"
      - id: "toi_clipper"
        name: "Nail Clippers"
      - id: "toi_shave"
        name: "Shaving Cream & Razor"
      - id: "toi_earplugs"
        name: "Earplugs"
        description: "Useful to have something when you sleep close to the engine, or when people start to party and you want to sleep."
      - id: "toi_sunscreen"
        name: "Sunscreen (High SPF)"
        description: "The sun is stronger on the water due to reflection."

  - id: "tech"
    title: "🪛 Tech Kit"
    priority: "should-have"
    items:
      - id: "tech_phone"
        name: "Phone + Charger"
        defaultBag: "lug_2"
      - id: "tech_powerbank"
        name: "Powerbank"
        defaultBag: "lug_2"
      - id: "tech_watch"
        name: "Watch + Charger"
        defaultBag: "lug_2"
      - id: "tech_cables"
        name: "Charging Cables / Adapters"
        description: "Inspect the yacht documents! Sockets vary wildly: some have 230V EU, older yachts have USB-A, and modern ones have USB-C."
        defaultBag: "lug_2"
      - id: "tech_headlamp"
        name: "Headlamp (Must have RED light)"
        description: "Red light preserves night vision for everyone on deck."
      - id: "tech_camera"
        name: "Camera / GoPro"
        description: "Capture the memories!"
      - id: "tech_speaker"
        name: "Bluetooth Speaker"
        description: "Check if one is not already on the ship, many yachts include them."
      - id: "tech_multitool"
        name: "Multitool / Knife"
        description: "Check-in luggage only!"
      - id: "tech_laptop"
        name: "Laptop"
        description: "If you really are such a workaholic, otherwise you can skip it."
        captainOnly: true
        defaultBag: "lug_2"

  - id: "meds"
    title: "💊 Med Kit"
    priority: "should-have"
    items:
      - id: "med_pain"
        name: "Painkillers (Ibuprofen / Paracetamol)"
      - id: "med_charcoal"
        name: "Activated Charcoal / Stomach Meds"
        description: "Essential for diarrhea and stomach issues."
      - id: "med_personal"
        name: "Personal Prescription Meds"
        description: "Bring enough for the whole trip."

  - id: "fun"
    title: "📖 Chill"
    priority: "nice-to-have"
    items:
      - id: "fun_book"
        name: "Book / Kindle"
      - id: "fun_edu_book"
        name: "Educational Sailing Book"
        captainOnly: true
      - id: "fun_games"
        name: "Card / Board Games"
        description: "Align with the rest of the crew so everyone doesn't bring the same thing."
      - id: "fun_thermos"
        name: "Thermal Cup / Thermos"
        description: "Great for keeping coffee or tea hot during cold night watches."
