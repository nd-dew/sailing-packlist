id: "cyprus_october"
name: "Cyprus, October, 5 Nights"
description: "5-night sailing cruise in Cyprus (October). Warm Mediterranean sea (~24°C), mild autumn sun, and light evening breezes."
showers: 5
disableRoles: true

warnings:
  - id: "warn_cyprus_1"
    text: "Soft Duffel Only: Rigid suitcases cannot be stowed on charter boats. Bring a collapsible duffel bag."

luggages:
  - id: "lug_3"
    name: "On me"
    icon: "on_person"
    color: "#B10DC9"
  - id: "lug_1"
    name: "Duffel"
    icon: "duffel"
    color: "#0074D9"

categories:
  - id: "clothes"
    title: "👕 Clothes"
    priority: "must-have"
    items:
      - id: "cyp_underwear"
        name: "Underwear"
        qty: 5
        description: "5 pairs of fresh underwear for 5 nights."
        defaultBag: "lug_1"
      - id: "cyp_socks"
        name: "Socks"
        qty: 6
        description: "6 pairs of comfortable socks."
        defaultBag: "lug_1"
      - id: "cyp_tops"
        name: "Tops (t-shirts)"
        qty: 6
        description: "6 daytime t-shirts."
        defaultBag: "lug_1"
      - id: "cyp_long_tops"
        name: "Long tops"
        qty: 2
        description: "2 breathable long-sleeved tops for sun and deck breeze protection."
        defaultBag: "lug_1"
      - id: "cyp_normal_jacket"
        name: "Normal jacket"
        qty: 1
        description: "Comfortable jacket for cooler evenings or travel."
        defaultBag: "lug_1"
      - id: "cyp_rain_jacket"
        name: "Decathlon rain jacket"
        qty: 1
        description: "Lightweight, highly compressible waterproof jacket."
        defaultBag: "lug_1"
      - id: "cyp_rain_pants"
        name: "Decathlon bicycle rain pants"
        qty: 1
        description: "Compressible rain pants just in case of spray or light rain."
        defaultBag: "lug_1"
      - id: "cyp_sweatpants"
        name: "Long sweatpants"
        qty: 1
        description: "Comfortable sweatpants for sleeping, chilling, or evening deck watch."
        defaultBag: "lug_1"
      - id: "cyp_shorts"
        name: "Shorts"
        qty: 1
        description: "Daytime deck and swimming shorts."
        defaultBag: "lug_1"
      - id: "cyp_hat"
        name: "Hat"
        qty: 1
        description: "Sun protection cap or hat."
        defaultBag: "lug_1"
      - id: "cyp_towel"
        name: "Quickly drying towel"
        qty: 1
        description: "Compact microfiber towel that dries rapidly in the sea breeze."
        defaultBag: "lug_1"
      - id: "cyp_gloves"
        name: "Sailing gloves"
        qty: 2
        description: "2 pairs of gloves for line, anchor, and mooring handling."
        defaultBag: "lug_1"
      - id: "cyp_sneakers"
        name: "Sneakers"
        qty: 1
        description: "Comfortable non-slip sneakers for travel and safe footing on deck."
        defaultBag: "lug_3"
      - id: "cyp_sandals"
        name: "Sandals"
        qty: 1
        description: "For walking ashore, marina showers, and relaxing off-deck."
        defaultBag: "lug_1"

  - id: "cosmetics"
    title: "🧴 Cosmetics"
    priority: "should-have"
    items:
      - id: "cyp_sunscreen"
        name: "Sunscreen"
        description: "Sunscreen for strong Mediterranean sun reflection on the water."
        defaultBag: "lug_1"
      - id: "cyp_lip_balm"
        name: "Lip balm"
        description: "Lip balm with SPF to prevent chapped lips from salt and sun."
        defaultBag: "lug_1"
      - id: "cyp_toiletries"
        name: "Basic toiletries"
        description: "Toothbrush, toothpaste, and minimal personal care."
        defaultBag: "lug_1"
      - id: "cyp_earplugs"
        name: "Earplugs"
        description: "Blocks halyard slapping, anchor windlass, and cabin noise."
        defaultBag: "lug_1"
      - id: "cyp_eye_mask"
        name: "Eye mask"
        description: "Blocks bright early morning sunlight coming through cabin hatches."
        defaultBag: "lug_1"
      - id: "cyp_painkillers"
        name: "Painkillers (Ibuprofen / Paracetamol)"
        description: "For headaches, muscle soreness, or mild injuries."
        defaultBag: "lug_1"
      - id: "cyp_stomach_meds"
        name: "Activated Charcoal / Stomach Meds"
        description: "For indigestion, food poisoning, or upset stomach."
        defaultBag: "lug_1"
      - id: "cyp_prescription_meds"
        name: "Personal Prescription Meds"
        description: "Any essential daily personal prescription medication."
        defaultBag: "lug_1"

  - id: "technical"
    title: "⚡ Technical stuff"
    priority: "should-have"
    items:
      - id: "cyp_headlamp"
        name: "Headlamp"
        description: "Hands-free light for night anchor watch and dim cabins."
        defaultBag: "lug_1"
      - id: "cyp_phone_case"
        name: "Waterproof phone case"
        description: "Protection against water splashes and slips overboard."
        defaultBag: "lug_1"
      - id: "cyp_rope"
        name: "Rope (10 meters)"
        description: "10m line to practice knots, lash gear, or general boat use."
        defaultBag: "lug_1"
      - id: "cyp_phone_charger"
        name: "Phone & charger / Power bank"
        description: "Keep charged for navigation, photos, and safety."
        defaultBag: "lug_3"
      - id: "cyp_type_g_adapter"
        name: "Type G plug converter"
        description: "Cyprus uses British 3-pin Type G outlets in marinas and ashore."
        defaultBag: "lug_1"
      - id: "cyp_ebook"
        name: "E-book reader"
        description: "For relaxing and reading while at anchor or off watch."
        defaultBag: "lug_1"
      - id: "cyp_thermos"
        name: "Thermos"
        description: "Insulated bottle for hot tea on evening watch or cold water in the sun."
        defaultBag: "lug_1"
      - id: "cyp_camera"
        name: "Camera"
        description: "Camera and charger/accessories for coastal and sailing shots."
        defaultBag: "lug_1"

  - id: "formalities"
    title: "📄 Formalities"
    priority: "must-have"
    items:
      - id: "cyp_passport"
        name: "Passport"
        description: "Valid passport for international travel and port clearance."
        defaultBag: "lug_3"
      - id: "cyp_src"
        name: "SRC certificate"
        description: "Short Range Certificate (VHF radio operator license)."
        defaultBag: "lug_3"
      - id: "cyp_logbook"
        name: "Logbook"
        description: "Sailing logbook for logging miles and passages."
        defaultBag: "lug_3"
      - id: "cyp_sailing_cert"
        name: "Sailing certificate"
        description: "Skipper or crew sailing qualification certificate."
        defaultBag: "lug_3"
      - id: "cyp_diving_cert"
        name: "Diving certificate"
        description: "Scuba diving certification card."
        defaultBag: "lug_3"
      - id: "cyp_insurance"
        name: "Insurance"
        description: "Travel & sailing/diving health insurance policy document."
        defaultBag: "lug_3"

  - id: "do_not_bring"
    title: "🚫 Do not bring"
    priority: "nice-to-have"
    items:
      - id: "not_hard_suitcase"
        name: "Large hard suitcase"
        description: "Impossible to store inside sailboat lockers. Duffel only."
        defaultBag: "lug_1"
      - id: "not_foulies"
        name: "Heavy foul weather gear / rain boots"
        description: "It's 24°C with light wind—heavy ocean gear is unnecessary bulk."
        defaultBag: "lug_1"
