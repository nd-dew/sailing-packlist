schema: 1
name: "Mediterranean - BlueWard 26"
description: "Week-long early May cruise in Croatia"
showers: 7

warnings:
  - id: "warn_1"
    text: "No Hard Suitcases: Soft bags only! Rigid luggage is impossible to store on a boat. Bring a soft duffel."
  - id: "warn_2"
    text: "Water Shoes / Flip-flops: Essential for public showers and protecting your feet from sea urchins when swimming near rocky shores."

luggages:
  - id: "lug_3"
    name: "On me"
    icon: "on_person"
    color: "#B10DC9"
  - id: "lug_2"
    name: "Backpack"
    icon: "backpack"
    color: "#FF851B"
  - id: "lug_1"
    name: "Duffel"
    icon: "duffel"
    color: "#0074D9"

categories:
  - id: "docs"
    title: "📄 Get Formal"
    priority: "must-have"
    items:
      - id: "docs_passport"
        name: "ID Card / Passport"
        bag: "lug_2"
      - id: "docs_health_insurance"
        name: "Health Insurance Card (EHIC)"
        description: "European Health Insurance Card or personal travel/medical insurance details."
        bag: "lug_2"
      - id: "docs_printed"
        name: "Print Documents"
        bag: "lug_2"
        captainOnly: true
        subItems:
          - id: "docs_boarding_pass"
            name: "Boarding pass (from charter)"
          - id: "docs_logbook"
            name: "Logbook"
          - id: "docs_maps"
            name: "Nautical Maps & Instruments"
          - id: "docs_insurance"
            name: "Boat Insurance / Charter Documents"
          - id: "docs_songbook"
            name: "Songbook"
      - id: "docs_license"
        name: "Sailing License"
        description: "Required for the Skipper. Not needed for crew."
        bag: "lug_3"
        captainOnly: true
      - id: "docs_vhf"
        name: "VHF License"
        description: "Official radio operator certificate."
        bag: "lug_2"
        captainOnly: true
      - id: "docs_driving"
        name: "Driving License"
        description: "Sometimes you want to rent a car or a scooter while on cruise brrrum!"
        bag: "lug_3"
      - id: "docs_diving"
        name: "Diving License"
        description: "If you plan to rent scuba gear."
        bag: "lug_2"
      - id: "docs_credit_card"
        name: "Credit Card"
        description: "For boat deposits, emergencies, or larger expenses."
        bag: "lug_3"
      - id: "docs_cash"
        name: "Local Currency"
        description: "Many smaller island restaurants and local ports only accept cash."
        bag: "lug_3"

  - id: "tough"
    title: "⚡ Get Warm"
    priority: "must-have"
    items:
      - id: "base_thermal_top"
        name: "Thermal Top base layer"
        description: "Highly recommended for night watches."
        bag: "lug_1"
      - id: "base_thermal_bot"
        name: "Thermal Base Layer (Bottom)"
        description: "Highly recommended for cold night watches."
        bag: "lug_1"
      - id: "out_shoes_tough"
        name: "Rain Boots"
        description: "For standing in the rain during a night watch. Keep your feet dry to stay warm!"
        bag: "lug_1"
      - id: "out_mid_fleece"
        name: "Warm Mid-layer: Fleece / Puffer"
        description: "The layer that traps heat. Essential when the sun goes down. A light puffer is great for extra warmth without the bulk."
        bag: "lug_1"
      - id: "out_mid_pants"
        name: "Warm Mid-layer: Sweatpants"
        description: "Comfy, warm pants for lounging or under waterproofs."
        bag: "lug_1"
      - id: "out_wind_jacket"
        name: "Waterproof Top"
        description: "Your outer shield against rain and salt spray."
        bag: "lug_1"
      - id: "out_wind_pants"
        name: "Waterproof Bottoms"
        description: "Keeps your legs dry when sitting on wet decks."
        bag: "lug_1"
      - id: "out_hat_warm"
        name: "Warm Beanie Hat"
        description: "Crucial for keeping body heat in during night watches."
        bag: "lug_1"

  - id: "base"
    title: "👕 Get Dressed"
    priority: "should-have"
    items:
      - id: "base_underwear"
        name: "Underwear"
        qty: 0
        bag: "lug_1"
      - id: "base_socks"
        name: "Socks"
        qty: 0
        bag: "lug_1"
      - id: "base_tshirt"
        name: "T-Shirts"
        qty: 0
        bag: "lug_1"
      - id: "out_shoes_deck"
        name: "Sneakers"
        description: "One pair of sneakers for everything: exploring on land and moving on the boat. Ensure soles are non-marking."
        bag: "lug_1"
      - id: "out_shorts"
        name: "Shorts"
        bag: "lug_1"
      - id: "out_swim"
        name: "Swimwear"
        description: "Check the water temperature here: https://www.seatemperature.org/ to see if you need a shorty or just standard trunks."
        bag: "lug_1"
      - id: "out_buff"
        name: "Buff"
        description: "A neck gaiter or round piece of material that can be made into a scarf or cap to warm yourself."
        bag: "lug_1"
      - id: "out_hat_sun"
        name: "Sun Hat"
        bag: "lug_1"
      - id: "out_gloves"
        name: "Gloves"
        description: "Protects your hands from line burns when handling ropes."
        bag: "lug_1"
      - id: "out_nice_clothes"
        name: "Nice Outfit"
        description: "Check with the captain! Are we dining at fancy marinas or fighting storms? Bring something unwrinkled or themed if planned."
        bag: "lug_1"
      - id: "out_sunglasses"
        name: "Sunglasses"
        description: "Essential. Reflection from the water doubles the sun exposure to your eyes."
        bag: "lug_1"

  - id: "toiletries"
    title: "🧴 Get Romantic"
    priority: "should-have"
    items:
      - id: "out_sleeping_bag"
        name: "Sleeping Bag"
        description: "Check with the captain! Most charters provide linens, but a sleeping bag is good for colder nights."
        bag: "lug_1"
      - id: "toi_brush"
        name: "Toothbrush & Paste"
        bag: "lug_1"
      - id: "toi_towel"
        name: "Quick-dry Sports Towel"
        description: "Saves space and dries much faster in the yacht cabin."
        bag: "lug_1"
      - id: "med_gel"
        name: "Universal Gel"
        bag: "lug_1"
      - id: "toi_clipper"
        name: "Nail Clippers"
        bag: "lug_1"
      - id: "toi_shave"
        name: "Shaving Cream & Razor"
        bag: "lug_1"
      - id: "toi_earplugs"
        name: "Earplugs"
        description: "Useful to have something when you sleep close to the engine, or when people start to party and you want to sleep."
        bag: "lug_1"
      - id: "toi_eyemask"
        name: "Eye Mask"
        description: "Helps you sleep during the day after a long night watch."
        bag: "lug_1"
      - id: "med_sunscreen"
        name: "Sunscreen"
        description: "The sun is stronger on the water due to reflection."
        bag: "lug_1"

  - id: "tech"
    title: "🪛 Tech Kit"
    priority: "should-have"
    items:
      - id: "tech_phone"
        name: "Phone Kit"
        bag: "lug_2"
      - id: "tech_headlamp"
        name: "Headlamp (Must have RED light)"
        description: "Red light preserves night vision for everyone on deck."
        bag: "lug_1"
      - id: "tech_cables"
        name: "Charging & Cables"
        bag: "lug_2"
        subItems:
          - id: "tech_cables_laptop"
            name: "Laptop Charger"
          - id: "tech_cables_phone"
            name: "Phone Charger"
          - id: "tech_cables_watch"
            name: "Watch Charger"
          - id: "tech_cables_powerbank"
            name: "Power bank"
          - id: "tech_cables_adapter"
            name: "USB-A to USB-C adapter"
      - id: "tech_camera"
        name: "Camera"
        description: "Capture the memories!"
        bag: "lug_1"
      - id: "tech_radios"
        name: "Radio"
        description: "Optional. VHF best, walkie-talkie ok."
        bag: "lug_2"
      - id: "tech_multitool"
        name: "Multitool / Knife"
        description: "Check-in luggage only!"
        bag: "lug_1"
      - id: "tech_laptop"
        name: "Laptop"
        description: "If you really are such a workaholic, otherwise you can skip it."
        bag: "lug_2"
        captainOnly: true

  - id: "meds"
    title: "💊 Med Kit"
    priority: "should-have"
    items:
      - id: "med_pain"
        name: "Painkillers (Ibuprofen / Paracetamol)"
        bag: "lug_1"
      - id: "med_charcoal"
        name: "Activated Charcoal / Stomach Meds"
        description: "Essential for diarrhea and stomach issues."
        bag: "lug_1"
      - id: "med_personal"
        name: "Personal Prescription Meds"
        description: "Bring enough for the whole trip."
        bag: "lug_1"

  - id: "fun"
    title: "📖 Chill"
    priority: "nice-to-have"
    items:
      - id: "fun_book"
        name: "Book / Kindle"
        bag: "lug_1"
      - id: "fun_edu_book"
        name: "Educational Sailing Book"
        bag: "lug_1"
        captainOnly: true
      - id: "fun_games"
        name: "Card / Board Games"
        description: "Align with the rest of the crew so everyone doesn't bring the same thing."
        bag: "lug_1"
      - id: "fun_instrument"
        name: "Musical Instrument"
        description: "If you play on it."
        bag: "lug_1"
      - id: "fun_pen_paper"
        name: "Pen & Paper"
        bag: "lug_1"
      - id: "fun_thermos"
        name: "Thermal Cup / Thermos"
        description: "Great for keeping coffee or tea hot during cold night watches."
        bag: "lug_1"
